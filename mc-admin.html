<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Approve | Show Me NYC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <a class="brand" href="./?intro">Show&nbsp;Me&nbsp;<span>NYC</span></a>
        <a class="back" href="missed-connections.html">Missed connections</a>
      </header>
      <main>
        <p class="when">Owner only</p>
        <h1>Approve shows and posts</h1>
        <p class="where" id="adStatus"></p>

        <!-- Signed out: ask for a sign-in link by email -->
        <form class="compose" id="adSignin" hidden novalidate>
          <label>Your email
            <input id="adEmail" type="email" autocomplete="email" required />
          </label>
          <div class="actions"><button class="btn primary" type="submit" id="adSend">Email me a sign-in link</button></div>
          <p class="hint" id="adNote" role="status"></p>
          <p class="hint">You stay signed in on this device until you tap Sign out. Don't sign in on a shared device.</p>
        </form>

        <div id="adPanel" hidden>
          <section class="pending">
            <h2 id="adShowsHead">Shows waiting</h2>
            <div class="posts" id="adShows"></div>
            <p class="hint" id="adShowsNone" hidden>No shows waiting.</p>
          </section>
          <section class="pending">
            <h2 id="adPendingHead">Posts waiting</h2>
            <div class="posts" id="adPending"></div>
            <p class="hint" id="adNone" hidden>No posts waiting.</p>
          </section>
          <section>
            <h2>Sent-in shows on the list</h2>
            <div class="posts" id="adShowsLive"></div>
            <p class="hint" id="adShowsLiveNone" hidden>None yet.</p>
          </section>
          <section>
            <h2>Posts up on the site</h2>
            <div class="posts" id="adLive"></div>
          </section>
          <section>
            <button class="more as-btn" id="adOut">Sign out</button>
          </section>
        </div>
      </main>
    </div>

    <script src="shows-data.js"></script>
    <script src="connections-data.js"></script>
    <script>
      (function () {
        "use strict";
        var M = CONNECTIONS_META;
        function $(id) { return document.getElementById(id); }
        function el(tag, cls, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined) e.textContent = text;
          return e;
        }
        if (!M.supabaseUrl || !M.supabaseKey) { $("adStatus").textContent = "Supabase isn't set up in connections-data.js yet."; return; }
        var BASE = M.supabaseUrl.replace(/\/+$/, "");
        var HERE = location.origin + location.pathname;
        var KEY = "smn-admin-token";

        /* The sign-in link lands back here with a short-lived access token and
           a refresh token. Both are kept on this device so the owner stays
           signed in; the access token is renewed when it runs out. */
        var session = null; // { access, refresh, exp (ms) }
        function save(s) {
          session = s;
          try { if (s) localStorage.setItem(KEY, JSON.stringify(s)); else localStorage.removeItem(KEY); } catch (e) {}
        }
        function fromAuth(j) {
          return { access: j.access_token, refresh: j.refresh_token || "", exp: Date.now() + (parseInt(j.expires_in, 10) || 3600) * 1000 };
        }
        try {
          var h = new URLSearchParams(location.hash.replace(/^#/, ""));
          if (h.get("access_token")) {
            save(fromAuth({ access_token: h.get("access_token"), refresh_token: h.get("refresh_token"), expires_in: h.get("expires_in") }));
            history.replaceState(null, "", HERE);
          } else {
            if (h.get("error_description")) {
              $("adStatus").textContent = h.get("error_description").replace(/\+/g, " ");
              history.replaceState(null, "", HERE);
            }
            session = JSON.parse(localStorage.getItem(KEY) || "null");
          }
        } catch (e) { session = null; }

        var renewing = null;
        function renew() {
          if (!session || !session.refresh) return Promise.reject(new Error("no refresh"));
          if (!renewing) {
            renewing = fetch(BASE + "/auth/v1/token?grant_type=refresh_token", {
              method: "POST",
              headers: { apikey: M.supabaseKey, "Content-Type": "application/json" },
              body: JSON.stringify({ refresh_token: session.refresh })
            }).then(function (r) {
              if (!r.ok) throw new Error("refresh " + r.status);
              return r.json();
            }).then(function (j) { save(fromAuth(j)); })
              .then(function () { renewing = null; }, function (e) { renewing = null; throw e; });
          }
          return renewing;
        }
        function call(path, opts) {
          var headers = { apikey: M.supabaseKey, Authorization: "Bearer " + session.access };
          if (opts.body) headers["Content-Type"] = "application/json";
          if (opts.prefer) headers.Prefer = opts.prefer;
          return fetch(BASE + path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
        }
        function api(path, opts) {
          opts = opts || {};
          var expired = function () { signOut("Your sign-in ran out. Ask for a new link."); throw new Error("signed out"); };
          if (!session) return Promise.reject(new Error("signed out"));
          // Renew a minute early, and once more if the server still says no.
          var ready = session.exp - Date.now() < 60000 ? renew().catch(expired) : Promise.resolve();
          return ready.then(function () { return call(path, opts); }).then(function (r) {
            if (r.status !== 401) return r;
            return renew().then(function () { return call(path, opts); }, expired);
          }).then(function (r) {
            if (r.status === 401) expired();
            if (!r.ok) throw new Error("Request failed (" + r.status + ")");
            return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
          });
        }
        function signOut(msg) {
          save(null);
          $("adPanel").hidden = true;
          $("adSignin").hidden = false;
          $("adStatus").textContent = msg || "Sign in to check shows and posts.";
        }

        /* ---------- signed out ---------- */
        $("adSignin").addEventListener("submit", function (e) {
          e.preventDefault();
          var email = $("adEmail").value.trim(), note = $("adNote"), btn = $("adSend");
          if (!email) { note.textContent = "Type your email first."; return; }
          btn.disabled = true;
          note.textContent = "Sending…";
          fetch(BASE + "/auth/v1/otp?redirect_to=" + encodeURIComponent(HERE), {
            method: "POST",
            headers: { apikey: M.supabaseKey, "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, create_user: true })
          }).then(function (r) {
            note.textContent = r.ok ? "Check your email and open the link on this device."
              : r.status === 429 ? "Too many tries. Wait a minute and try again." : "Couldn't send the link. Try again.";
          }, function () { note.textContent = "Couldn't send the link. Try again."; })
            .then(function () { btn.disabled = false; });
        });
        $("adOut").addEventListener("click", function () {
          // Tell Supabase to end this sign-in too, then forget it here.
          if (session) call("/auth/v1/logout?scope=local", { method: "POST" }).catch(function () {});
          signOut();
        });

        /* ---------- signed in ---------- */
        var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        function when(iso) {
          var d = new Date(iso);
          return isNaN(d) ? "" : MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }
        function card(c, byId) {
          var art = el("article");
          var where = [c.night, c.venue].filter(Boolean).join(" · ");
          var parent = c.parent_id ? byId[c.parent_id] : null;
          art.appendChild(el("p", "pm", c.parent_id ? "Reply to #" + c.parent_id + (parent ? ": “" + parent.message.slice(0, 60) + (parent.message.length > 60 ? "…" : "") + "”" : "") : (where || "No show given")));
          art.appendChild(el("p", "pt", c.message));
          art.appendChild(el("p", "pf", c.name + " · #" + c.id + " · " + when(c.created_at)));
          var acts = el("div", "admin-actions");
          var a = el("button", "btn" + (c.approved ? "" : " primary"), c.approved ? "Take down" : "Approve");
          a.addEventListener("click", function () {
            a.disabled = true;
            api("/rest/v1/connections?id=eq." + c.id, { method: "PATCH", body: { approved: !c.approved }, prefer: "return=minimal" }).then(refresh, fail);
          });
          var d = el("button", "btn", "Delete");
          d.addEventListener("click", function () {
            if (d.getAttribute("data-sure") !== "1") { d.setAttribute("data-sure", "1"); d.textContent = "Tap again to delete"; return; }
            d.disabled = true;
            api("/rest/v1/connections?id=eq." + c.id, { method: "DELETE", prefer: "return=minimal" }).then(refresh, fail);
          });
          acts.appendChild(a); acts.appendChild(d);
          art.appendChild(acts);
          return art;
        }
        /* ---------- shows sent in on submit.html ---------- */
        var DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
        function nightLabel(d) {
          var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
          if (!p) return d || "";
          var t = new Date(Date.UTC(+p[1], +p[2] - 1, +p[3], 12));
          return DOW3[t.getUTCDay()] + " " + MONTHS[t.getUTCMonth()] + " " + t.getUTCDate() + (t.getUTCFullYear() !== new Date().getFullYear() ? " " + t.getUTCFullYear() : "");
        }
        function norm(t) { return String(t).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
        function actList(t) { return String(t).split(",").map(norm).filter(Boolean); }
        var LISTED = typeof SHOWS === "undefined" ? [] : SHOWS;
        var KNOWN = {};
        LISTED.forEach(function (s) { KNOWN[norm(s[2])] = 1; });
        /* What the list already has at that venue that night, and whether any
           of it shares an act with the show sent in. */
        function clash(c) {
          var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(c.night || "");
          if (!p || typeof SHOW_META === "undefined" || +p[1] !== SHOW_META.year || +p[2] !== SHOW_META.month) return null;
          var mine = actList(c.acts), same = [], near = [];
          LISTED.forEach(function (s) {
            if (s[0] !== +p[3] || norm(s[2]) !== norm(c.venue)) return;
            var shared = actList(s[3]).some(function (a) { return mine.indexOf(a) !== -1; });
            (shared ? same : near).push((s[1] ? s[1] + " · " : "") + s[3]);
          });
          return { same: same, near: near };
        }
        function showCard(c, contacts) {
          var art = el("article");
          art.appendChild(el("p", "pm", [nightLabel(c.night), c.start_time, c.venue].filter(Boolean).join(" · ")));
          art.appendChild(el("p", "pt", c.acts));
          var bits = [c.age === "AA" ? "All ages" : (c.age ? c.age + "+" : ""), c.note, "#" + c.id, "sent " + when(c.created_at)].filter(Boolean);
          art.appendChild(el("p", "pf", bits.join(" · ")));
          var info = el("p", "rf");
          if (c.ticket_url && /^https:\/\//i.test(c.ticket_url)) {
            var a0 = el("a", "", c.ticket_url.replace(/^https:\/\//i, "").slice(0, 60));
            a0.href = c.ticket_url; a0.target = "_blank"; a0.rel = "noopener noreferrer";
            info.appendChild(document.createTextNode("Link: "));
            info.appendChild(a0);
          } else info.textContent = "No link given.";
          art.appendChild(info);
          if (contacts[c.id]) art.appendChild(el("p", "rf", "Contact (only you see this): " + contacts[c.id]));
          var k = clash(c);
          if (k && k.same.length) art.appendChild(el("p", "flag", "Looks like it's already on the list: " + k.same.join(" / ")));
          else if (k && k.near.length) art.appendChild(el("p", "rf", "Also at this venue that night: " + k.near.join(" / ")));
          if (!KNOWN[norm(c.venue)]) art.appendChild(el("p", "rf", "New venue for the site: it will show without an area or map link."));
          var acts = el("div", "admin-actions");
          var a = el("button", "btn" + (c.approved ? "" : " primary"), c.approved ? "Take down" : "Approve");
          a.addEventListener("click", function () {
            a.disabled = true;
            api("/rest/v1/submitted_shows?id=eq." + c.id, { method: "PATCH", body: { approved: !c.approved }, prefer: "return=minimal" }).then(refresh, fail);
          });
          var d = el("button", "btn", "Delete");
          d.addEventListener("click", function () {
            if (d.getAttribute("data-sure") !== "1") { d.setAttribute("data-sure", "1"); d.textContent = "Tap again to delete"; return; }
            d.disabled = true;
            api("/rest/v1/submitted_shows?id=eq." + c.id, { method: "DELETE", prefer: "return=minimal" }).then(refresh, fail);
          });
          acts.appendChild(a); acts.appendChild(d);
          art.appendChild(acts);
          return art;
        }
        var SHOW_COLS = "id,created_at,night,start_time,venue,acts,note,age,ticket_url,approved";
        function loadShows() {
          return Promise.all([
            api("/rest/v1/submitted_shows?select=" + SHOW_COLS + "&order=night.asc,created_at.asc&limit=500"),
            api("/rest/v1/rpc/submitted_show_contacts", { method: "POST", body: {} }).catch(function () { return []; })
          ]).then(function (res) {
            var rows = res[0] || [], contacts = {};
            (res[1] || []).forEach(function (r) { contacts[r.id] = r.contact_email; });
            var W = $("adShows"), U = $("adShowsLive");
            W.textContent = ""; U.textContent = "";
            var waiting = rows.filter(function (c) { return !c.approved; });
            var up = rows.filter(function (c) { return c.approved; });
            waiting.forEach(function (c) { W.appendChild(showCard(c, contacts)); });
            up.forEach(function (c) { U.appendChild(showCard(c, contacts)); });
            $("adShowsNone").hidden = waiting.length > 0;
            $("adShowsLiveNone").hidden = up.length > 0;
            $("adShowsHead").textContent = "Shows waiting" + (waiting.length ? " · " + waiting.length : "");
          }, function (err) {
            if (err && err.message === "signed out") throw err;
            $("adShows").textContent = "";
            $("adShowsNone").textContent = "Couldn't load the shows just now.";
            $("adShowsNone").hidden = false;
          });
        }

        function fail(err) { if (err && err.message !== "signed out") $("adStatus").textContent = err.message; }
        function refresh() {
          return api("/rest/v1/rpc/is_connection_admin", { method: "POST", body: {} }).then(function (isAdmin) {
            if (!isAdmin) { signOut("That email isn't allowed to approve things here."); return; }
            return api("/rest/v1/connections?select=*&order=created_at.desc&limit=500").then(function (rows) {
              var byId = {};
              rows.forEach(function (c) { byId[c.id] = c; });
              var pending = rows.filter(function (c) { return !c.approved; }).reverse(); // oldest first
              var live = rows.filter(function (c) { return c.approved; });
              var P = $("adPending"), L = $("adLive");
              P.textContent = ""; L.textContent = "";
              pending.forEach(function (c) { P.appendChild(card(c, byId)); });
              live.forEach(function (c) { L.appendChild(card(c, byId)); });
              $("adNone").hidden = pending.length > 0;
              $("adPendingHead").textContent = "Posts waiting" + (pending.length ? " · " + pending.length : "");
              $("adStatus").textContent = "Approve puts it on the site. Take down hides it again. Delete removes it for good.";
              $("adSignin").hidden = true;
              $("adPanel").hidden = false;
              return loadShows();
            });
          }).catch(fail);
        }

        if (session) refresh(); else signOut();
      })();
    </script>
  </body>
</html>
