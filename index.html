<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <title>Show Me NYC — who's playing tonight?</title>
    <meta name="description" content="The city never sleeps. Why should you? Every show in NYC, night by night." />
    <link rel="canonical" href="https://talmanjoseph-creator.github.io/gunk-shows-dashboard/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Show Me NYC" />
    <meta property="og:title" content="Show Me NYC — who's playing tonight?" />
    <meta property="og:description" content="The city never sleeps. Why should you?" />
    <meta property="og:url" content="https://talmanjoseph-creator.github.io/gunk-shows-dashboard/" />
    <meta property="og:image" content="https://talmanjoseph-creator.github.io/gunk-shows-dashboard/og.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Cpath fill='%23ff4d4d' d='M3 29V17h6v12zM10 29V11l6-3v21zM17 29V13h2V8h1V3h1v5h1v5h2v16zM25 29V19h4v10z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #ffffff;
        --ink: #111111;
        --ink-soft: #3d3d3d;
        --muted: #6f6f6f;
        --line: #111111;
        --hair: #e2e2e2;
        --accent: #d92323;
        --accent-ink: #ffffff;
        --chip-bg: #f4f4f4;
        --chip-on: #111111;
        --chip-on-ink: #ffffff;
        --past-bg: #fafafa;
        /* Kept equal to the sticky bar's real height by JS. */
        --sticky-h: 150px;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0d;
          --ink: #f2f2f2;
          --ink-soft: #c9c9c9;
          --muted: #9a9a9a;
          --line: #f2f2f2;
          --hair: #2a2a2a;
          --accent: #ff4d4d;
          --accent-ink: #141414;
          --chip-bg: #1c1c1c;
          --chip-on: #f2f2f2;
          --chip-on-ink: #111111;
          --past-bg: #121212;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html { scroll-behavior: smooth; }
      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Archivo", system-ui, sans-serif;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .skip {
        position: absolute; left: -999px; top: 0; z-index: 50;
        background: var(--ink); color: var(--bg);
        font: 600 13px var(--mono); padding: 10px 14px;
      }
      .skip:focus { left: 8px; top: 8px; }

      /* ---------- masthead ---------- */
      header.mast { position: relative; border-bottom: 4px solid var(--line); padding: 28px 0 18px; }
      /* Skyline standing on the masthead's bottom rule. */
      .skyline {
        position: absolute; right: 0; bottom: 0;
        width: clamp(118px, 30vw, 320px); height: auto;
        fill: var(--line); pointer-events: none;
      }
      header.mast > :not(.skyline) { position: relative; }
      h1 {
        font-size: clamp(34px, 6vw, 58px);
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 0.95;
        margin: 0;
        text-transform: uppercase;
      }
      h1 .red { color: var(--accent); }
      .tagline { font-size: clamp(17px, 2.6vw, 22px); font-weight: 700; line-height: 1.25; margin: 12px 0 0; }
      .hook {
        display: inline-flex; align-items: baseline; gap: 10px;
        margin-top: 18px; padding: 10px 18px 12px;
        background: var(--accent); color: var(--accent-ink);
        font-size: 19px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em;
        text-decoration: none;
      }
      .hook b { font-size: 40px; line-height: 1; letter-spacing: -0.02em; }
      .hook:hover { background: var(--ink); color: var(--bg); }
      .mast-meta { font: 500 12.5px var(--mono); color: var(--muted); margin: 14px 0 0; max-width: calc(100% - clamp(118px, 30vw, 320px) - 12px); }

      /* ---------- sticky bar ---------- */
      .controls {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg);
        border-bottom: 2px solid var(--line);
        padding: 10px 0 8px;
      }
      .ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .brand-mini {
        font-weight: 900; font-size: 15px; letter-spacing: 0.01em;
        text-transform: uppercase; white-space: nowrap; margin-right: 2px;
      }
      .brand-mini .red { color: var(--accent); }
      label.search { flex: 1 1 220px; display: flex; }
      label.search input {
        width: 100%; min-height: 42px;
        font: 500 16px var(--mono); /* 16px stops iOS zooming on focus */
        color: var(--ink);
        background: var(--bg);
        border: 2px solid var(--line);
        border-radius: 0;
        padding: 6px 12px;
        -webkit-appearance: none; appearance: none;
      }
      label.search input::placeholder { color: var(--muted); }
      .chip {
        display: inline-flex; align-items: center; gap: 6px;
        min-height: 40px; padding: 0 13px;
        font: 600 12.5px var(--mono); white-space: nowrap;
        border: 2px solid var(--line);
        background: var(--chip-bg);
        color: var(--ink);
        cursor: pointer;
        border-radius: 999px;
      }
      .chip:hover { border-color: var(--accent); color: var(--accent); }
      .chip[aria-pressed="true"], .chip[aria-expanded="true"] {
        background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on);
      }
      .chip.red[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
      .chip .n { font-weight: 500; opacity: 0.75; }

      /* quick chips, then a swipeable day strip (narrow screens only; wide
         screens get the same day links in the sidebar) */
      .quick { display: flex; gap: 6px; margin-top: 8px; }
      .quick .chip { min-height: 38px; padding: 0 12px; }
      .strip {
        position: relative;
        display: flex; gap: 6px; align-items: center;
        margin-top: 8px;
        overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      }
      .strip::-webkit-scrollbar { display: none; }
      .strip a.day { flex: 0 0 auto; }
      a.day {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 38px; padding: 0 9px;
        font: 600 12px var(--mono); white-space: nowrap;
        border: 1.5px solid var(--line); border-radius: 4px;
        color: var(--ink); text-decoration: none;
      }
      a.day:hover { border-color: var(--accent); color: var(--accent); }
      a.day.past { border-color: var(--hair); color: var(--muted); }
      a.day.none { opacity: 0.4; }
      a.day.today { border-color: var(--accent); color: var(--accent); }
      a.day[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
      a.day.today[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      .result-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding-top: 6px; min-height: 30px; }
      .result-line { font: 500 12.5px var(--mono); color: var(--muted); margin: 0; }
      .link-btn {
        font: 600 12.5px var(--mono);
        background: none; border: 0; color: var(--accent);
        cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
        padding: 6px 0; min-height: 30px;
      }

      /* filter panel: drops over the list so the bar keeps its height */
      .panel {
        position: absolute; left: 0; right: 0; top: calc(100% + 2px);
        background: var(--bg);
        border-bottom: 2px solid var(--line);
        padding: 14px 0 16px;
        max-height: calc(100vh - var(--sticky-h) - 12px);
        max-height: calc(100dvh - var(--sticky-h) - 12px);
        overflow-y: auto;
        box-shadow: 0 22px 28px -22px rgba(0, 0, 0, 0.45);
      }
      .panel .ctl-row + .ctl-row { margin-top: 12px; }
      .ctl-label {
        font: 600 11px var(--mono);
        text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
        flex: 0 0 100%;
      }
      .panel-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hair); }
      .chip.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
      .chip.solid:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

      .stale-note {
        border: 2px solid var(--accent); color: var(--accent);
        font: 600 13px var(--mono);
        padding: 10px 12px; margin: 18px 0 0;
      }

      /* ---------- layout ---------- */
      .layout { display: block; }
      #days { scroll-margin-top: var(--sticky-h); min-height: 60vh; }
      #days:focus { outline: none; }
      .only-wide { display: none; }
      @media (min-width: 960px) {
        .layout { display: grid; grid-template-columns: 1fr 250px; gap: 36px; align-items: start; }
        aside {
          position: sticky; top: var(--sticky-h);
          max-height: calc(100vh - var(--sticky-h)); overflow-y: auto; padding-bottom: 20px;
        }
        .only-wide { display: block; }
        .strip { display: none; }
      }

      /* ---------- day sections ---------- */
      .past-toggle {
        display: block; width: 100%; margin-top: 18px;
        font: 600 12.5px var(--mono); text-align: left;
        min-height: 44px; padding: 0 14px;
        background: none; color: var(--ink-soft);
        border: 2px dashed var(--muted); cursor: pointer;
      }
      .past-toggle:hover { border-color: var(--accent); color: var(--accent); }
      section.day { padding: 26px 0 6px; scroll-margin-top: var(--sticky-h); }
      section.day.past { background: var(--past-bg); }
      .day-head {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;
        border-bottom: 3px solid var(--line);
        padding-bottom: 6px;
      }
      .day-head h2 {
        margin: 0; font-size: clamp(22px, 3.4vw, 30px); font-weight: 900;
        text-transform: uppercase; letter-spacing: -0.01em;
      }
      .day-head .dnum { font-family: var(--mono); font-size: 13px; color: var(--muted); }
      .day-head .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .tonight-tag {
        font: 700 11px var(--mono);
        background: var(--accent); color: var(--accent-ink);
        padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.08em;
      }
      section.day.tonight .day-head { border-bottom-color: var(--accent); }
      .past-tag {
        font: 600 11px var(--mono);
        color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em;
      }
      .no-shows { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 12px 0 4px; margin: 0; }

      .show {
        display: grid;
        grid-template-columns: 74px 1fr 40px;
        gap: 0 12px;
        padding: 9px 0 7px 2px;
        border-bottom: 1px solid var(--hair);
      }
      section.day.past .show { opacity: 0.7; }
      .show .time { font: 600 13px var(--mono); white-space: nowrap; padding-top: 4px; }
      .show .acts { font-size: 16.5px; font-weight: 700; line-height: 1.3; padding-top: 2px; }
      .show .acts a { color: inherit; text-decoration: none; }
      .show .acts a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .star {
        grid-column: 3; grid-row: 1 / span 2; align-self: start;
        width: 40px; height: 40px;
        background: none; border: 0; cursor: pointer;
        font-size: 21px; line-height: 1; color: var(--muted);
      }
      .star:hover { color: var(--accent); }
      .star[aria-pressed="true"] { color: var(--accent); }
      .show .meta {
        grid-column: 2;
        display: flex; flex-wrap: wrap; align-items: center; gap: 0 9px;
        font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft);
      }
      .venue-btn {
        font: inherit; background: none; border: 0; padding: 5px 0; cursor: pointer;
        color: var(--ink); font-weight: 600; text-align: left; text-decoration: underline;
        text-decoration-color: var(--muted); text-underline-offset: 3px;
      }
      .venue-btn:hover { color: var(--accent); }
      .area-tag { color: var(--muted); }
      .map-link {
        color: var(--muted); padding: 5px 0;
        text-decoration: underline; text-decoration-color: var(--hair); text-underline-offset: 3px;
      }
      .map-link:hover { color: var(--accent); }
      .badge {
        font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em;
        border: 1.5px solid var(--line); padding: 1px 6px; border-radius: 999px;
        text-transform: uppercase; white-space: nowrap;
      }
      .badge.age { background: var(--chip-bg); }
      .badge.note { border-color: var(--accent); color: var(--accent); }
      .badge.near { border-style: dashed; }
      .badge.out { border-style: dotted; }
      .badge.tix {
        border-color: var(--accent); color: var(--accent); text-decoration: none;
        font-size: 11px; padding: 5px 10px;
      }
      .badge.tix:hover { background: var(--accent); color: var(--accent-ink); }
      .badge.tix.sold { border-color: var(--muted); color: var(--muted); }
      .badge.tix.sold:hover { background: var(--muted); color: var(--bg); }
      .show .note-text { color: var(--muted); }

      /* ---------- sidebar ---------- */
      .side-h {
        font-size: 15px; font-weight: 900; text-transform: uppercase;
        border-bottom: 3px solid var(--line); padding-bottom: 6px; margin: 26px 0 10px;
      }
      .side-note { font: 500 12.5px var(--mono); color: var(--muted); margin: 0 0 10px; }
      .day-jump { display: flex; flex-wrap: wrap; gap: 4px; }
      .day-jump a.day { min-height: 30px; padding: 0 7px; font-size: 11.5px; }
      .saved-list, .venue-list { list-style: none; margin: 0; padding: 0; }
      .saved-list li { font: 500 12.5px var(--mono); padding: 5px 0; border-bottom: 1px solid var(--hair); }
      .saved-list a { color: var(--accent); font-weight: 600; text-underline-offset: 3px; }
      .saved-list li span { display: block; color: var(--ink-soft); }
      #savedBox .chip { margin-top: 10px; }
      .venue-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .venue-list button {
        font: 500 13px var(--mono);
        background: none; border: 0; padding: 5px 0; cursor: pointer; color: var(--ink);
        text-align: left;
      }
      .venue-list button:hover, .venue-list button.on { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .venue-list .n { font: 500 12px var(--mono); color: var(--muted); }

      .empty {
        border: 2px dashed var(--line); padding: 28px 18px; margin-top: 28px;
        font-family: var(--mono); font-size: 14px; color: var(--muted);
        text-align: center;
      }

      /* ---------- footer ---------- */
      footer.colophon {
        margin-top: 34px; border-top: 2px solid var(--line); padding-top: 14px;
        font-family: var(--mono); font-size: 12px; color: var(--muted);
      }
      footer.colophon a { color: var(--accent); }

      @media (max-width: 560px) {
        .brand-mini { flex: 1 1 auto; }
        label.search { order: 3; flex-basis: 100%; }
        .strip { margin-left: -16px; margin-right: -16px; padding: 0 16px; }
        .panel { left: -16px; right: -16px; padding-left: 16px; padding-right: 16px; }
        .show { grid-template-columns: 62px 1fr 40px; gap: 0 8px; }
        .show .area-tag { display: none; } /* the Area filter covers it; rows stay short */
        .controls:not(.has-line) .result-row { display: none; }
        .show .acts { font-size: 15.5px; }
        }
    </style>
  </head>
  <body>
    <a class="skip" href="#days">Skip to the listings</a>
    <div class="wrap">
      <header class="mast">
        <svg class="skyline" viewBox="0 0 480 200" aria-hidden="true" focusable="false">
          <rect x="0" y="130" width="40" height="70"/>
          <polygon points="44,200 44,100 78,80 78,200"/>
          <rect x="82" y="140" width="30" height="60"/>
          <rect x="88" y="114" width="18" height="18"/><polygon points="85,114 97,101 109,114"/>
          <rect x="89" y="132" width="2.5" height="8"/><rect x="102.5" y="132" width="2.5" height="8"/>
          <rect x="118" y="100" width="64" height="100"/><rect x="128" y="62" width="44" height="40"/><rect x="138" y="38" width="24" height="26"/><rect x="144" y="26" width="12" height="14"/><rect x="148.5" y="2" width="3" height="26"/>
          <rect x="188" y="116" width="36" height="84"/>
          <rect x="230" y="74" width="40" height="126"/><polygon points="230,74 250,24 270,74"/><rect x="249" y="6" width="2" height="22"/>
          <rect x="276" y="144" width="44" height="56"/>
          <rect x="324" y="70" width="30" height="130"/><rect x="338" y="42" width="2" height="30"/>
          <rect x="358" y="110" width="46" height="90"/><rect x="366" y="94" width="30" height="18"/>
          <rect x="408" y="136" width="32" height="64"/>
          <rect x="444" y="100" width="36" height="100"/>
        </svg>
        <h1>Show Me <span class="red">NYC</span></h1>
        <p class="tagline">The city never sleeps. Why should you?</p>
        <a class="hook" id="hook" href="#days" hidden></a>
        <p class="mast-meta" id="mastMeta"></p>
      </header>

      <div class="controls" role="region" aria-label="Search and filters">
        <div class="ctl-row">
          <span class="brand-mini">Show&nbsp;Me&nbsp;<span class="red">NYC</span></span>
          <label class="search">
            <input id="q" type="search" placeholder="Search acts, venues, notes…" aria-label="Search acts, venues and notes" autocomplete="off" />
          </label>
          <button class="chip" id="filterToggle" aria-expanded="false" aria-controls="filterPanel">Filters</button>
        </div>

        <div class="quick" id="quick">
          <button class="chip red" id="tonightBtn" data-when="tonight" aria-pressed="false">Tonight</button>
          <button class="chip" id="weekendBtn" data-when="weekend" aria-pressed="false">This weekend</button>
          <button class="chip" id="savedBtn" aria-pressed="false">★ Saved <span class="n" id="savedCount">0</span></button>
        </div>
        <nav class="strip" id="strip" aria-label="Jump to a day"></nav>

        <div class="result-row">
          <p class="result-line" id="resultLine" aria-live="polite"></p>
          <button class="link-btn" id="clearBtn" hidden aria-label="Clear filters">Clear</button>
          <button class="link-btn ics-btn" id="icsInline" hidden>Add saved to calendar</button>
        </div>

        <div class="panel" id="filterPanel" hidden>
          <div class="ctl-row">
            <button class="chip red" id="nearBtn" aria-pressed="false" title="Use your location to show gigs within 1 mile. It never leaves your browser.">Close to home</button>
            <button class="chip" id="releaseBtn" aria-pressed="false">Release shows only</button>
            <button class="chip" id="clubBtn" aria-pressed="false" title="Only club nights">Club nights only</button>
          </div>
          <div class="ctl-row" id="openRow" role="group" aria-label="Age: shows open to">
            <span class="ctl-label">Open to</span>
            <button class="chip" data-open="any" aria-pressed="true">Any age</button>
            <button class="chip" data-open="AA" aria-pressed="false" title="All-ages shows only">All ages</button>
            <button class="chip" data-open="16" aria-pressed="false" title="All-ages and 16+ shows">16 and up</button>
            <button class="chip" data-open="18" aria-pressed="false" title="All-ages, 16+ and 18+ shows">18 and up</button>
          </div>
          <div class="ctl-row" id="areaRow" role="group" aria-label="Area"></div>
          <div class="ctl-row panel-foot">
            <button class="chip solid" id="doneBtn">Show results</button>
            <button class="link-btn" id="clearBtn2">Clear filters</button>
          </div>
        </div>
      </div>

      <p class="stale-note" id="staleNote" hidden></p>
      <noscript><p class="stale-note">This page needs JavaScript to show the listings.</p></noscript>

      <div class="layout">
        <main id="days" tabindex="-1"></main>
        <aside>
          <div class="only-wide">
            <h2 class="side-h">Jump to a day</h2>
            <nav class="day-jump" id="dayJump" aria-label="Days"></nav>
          </div>
          <h2 class="side-h">Your list</h2>
          <div id="savedBox">
            <p class="side-note" id="savedEmpty">Tap ☆ on a show to save it here. Saved shows stay in this browser.</p>
            <ul class="saved-list" id="savedList"></ul>
            <button class="chip ics-btn" id="icsBtn" hidden>Add to calendar (.ics)</button>
          </div>
          <h2 class="side-h">Busiest venues</h2>
          <ul class="venue-list" id="venueList"></ul>
        </aside>
      </div>

      <footer class="colophon" id="colophon"></footer>
    </div>

    <script src="shows-data.js"></script>
    <script>
      "use strict";
      /* Listings live in shows-data.js: SHOW_META, SHOWS, GEO, AREA. */

      /* ---------- month + "today" ---------- */
      var YEAR = SHOW_META.year, MONTH = SHOW_META.month - 1;

        if (VENUE_SET[(v = p.get("venue"))]) state.venue = v;
        if (inMonth && ((v = p.get("when")) === "tonight" || (v === "weekend" && weekend.length))) state.when = v;
        if (p.get("release") === "1") state.release = true;

        if (state.venue) p.set("venue", state.venue);
        if (state.when !== "all") p.set("when", state.when);
        if (state.release) p.set("release", "1");

      function build() {

      /* ---------- filtering: show/hide the rows already on the page ---------- */

      }

      function renderSaved() {

      /* ---------- scrolling ---------- */

      }
      /* Highlight the day being read in the strip and the sidebar. */

      function updateCurrent() {

        }
        if (found === curDay) return;
        curDay = found;
        var strip = $("strip");
        for (var i = 0; i < dayLinks.length; i++) {
          var a = dayLinks[i], on = parseInt(a.getAttribute("data-day"), 10) === found;
          if (on) a.setAttribute("aria-current", "true"); else a.removeAttribute("aria-current");
          if (on && a.parentNode === strip && a.offsetWidth) {
            strip.scrollLeft = a.offsetLeft - (strip.clientWidth - a.offsetWidth) / 2;
          }
        }
      }
      window.addEventListener("scroll", function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () { ticking = false; updateCurrent(); });
      }, { passive: true });

      /* ---------- events ---------- */
      /* The bar can change height when a filter changes (the result line and
         "Clear filters" come and go), so measure it before repositioning. */
      function changed() { syncControls(); apply(); writeUrl(); syncStickyHeight(); toListTop(); }

      $("q").addEventListener("input", function (e) {
        state.q = fold(e.target.value.trim());
        apply(); writeUrl(); syncStickyHeight(); toListTop();
      });

      function setPanel(open) {
        $("filterPanel").hidden = !open;
        $("filterToggle").setAttribute("aria-expanded", open ? "true" : "false");
      }
      $("filterToggle").addEventListener("click", function () { setPanel($("filterPanel").hidden); });
      $("doneBtn").addEventListener("click", function () { setPanel(false); $("filterToggle").focus(); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && !$("filterPanel").hidden) { setPanel(false); $("filterToggle").focus(); }
      });
      document.addEventListener("click", function (e) {
        if (!$("filterPanel").hidden && !controls.contains(e.target)) setPanel(false);
      });

      $("filterPanel").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-open")) state.open = b.getAttribute("data-open");
        else if (b.hasAttribute("data-area")) state.area = b.getAttribute("data-area");
        else if (b.id === "clubBtn") state.club = !state.club;
        else if (b.id === "releaseBtn") state.release = !state.release;
        else return;
        changed();
      });

      function nearMsg(t) {
        $("resultLine").textContent = t;
        controls.classList.add("has-line");
        setTimeout(apply, 2600);
      }
      $("nearBtn").addEventListener("click", function () {
        var btn = this;
        if (state.near) { state.near = false; changed(); return; }
        if (!("geolocation" in navigator)) { nearMsg("Location isn't available in this browser."); return; }
        btn.textContent = "Locating\u2026";
        navigator.geolocation.getCurrentPosition(function (pos) {
          userLoc = [pos.coords.latitude, pos.coords.longitude];
          state.near = true;
          btn.textContent = "Close to home";
          changed();
        }, function () {
          btn.textContent = "Close to home";
          nearMsg("Couldn't get your location — enable location access to use this filter.");
        }, { timeout: 12000, maximumAge: 600000 });
      });

      $("quick").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-when")) {
          var w = b.getAttribute("data-when");
          state.when = state.when === w ? "all" : w;
        } else if (b.id === "savedBtn") {
          state.saved = !state.saved;
          if (state.saved) showPast = true; // a saved show from last week should still be listed
        } else return;
        changed();
      });

      function clearAll() {
        state = defaults();
        $("q").value = "";
        changed();
      }
      $("clearBtn").addEventListener("click", clearAll);
      $("clearBtn2").addEventListener("click", clearAll);

      // Venue filter: from a row or from the sidebar.
      document.addEventListener("click", function (e) {
        var b = e.target.closest(".venue-btn, .venue-btn-side");
        if (!b) return;
        var v = b.getAttribute("data-venue");
        state.venue = state.venue === v ? "" : v;
        changed();
      });

      // Save / unsave a show.
      $("days").addEventListener("click", function (e) {
        var b = e.target.closest(".star");
        if (b) {
          var s = SHOWS[parseInt(b.parentNode.getAttribute("data-i"), 10)];
          if (saved[s.key]) delete saved[s.key]; else saved[s.key] = 1;
          b.setAttribute("aria-pressed", saved[s.key] ? "true" : "false");
          b.textContent = saved[s.key] ? "★" : "☆";
          persistSaved();
          renderSaved();
          if (state.saved) apply();
          return;
        }
        if (e.target.id === "pastToggle") {
          showPast = !showPast;
          apply();
          if (!showPast) jumpTo($("days"));
        }
      });

      // Day links: unfold or unfilter the day first, then let the link jump.
      document.addEventListener("click", function (e) {
        var a = e.target.closest('a[href^="#day-"]');
        if (a) revealDay(parseInt(a.getAttribute("href").slice(5), 10));
      });

      /* ---------- calendar export ---------- */
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function ymd(dt) { return dt.getFullYear() + pad(dt.getMonth() + 1) + pad(dt.getDate()); }
      function icsText(t) {
        return String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
      }
      function icsFold(line) {
        var out = [];
        while (line.length > 73) { out.push(line.slice(0, 73)); line = " " + line.slice(73); }
        out.push(line);
        return out.join("\r\n");
      }
      function buildIcs(list) {
        var stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
        var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Show Me NYC//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
        list.forEach(function (s) {
          var tk = timeKey(s[1]), dt = new Date(YEAR, MONTH, s[0]);
          L.push("BEGIN:VEVENT", "UID:smn-" + YEAR + pad(MONTH + 1) + pad(s[0]) + "-" + s.i + "@show-me-nyc", "DTSTAMP:" + stamp);
          if (tk === 99999) {
            var next = new Date(YEAR, MONTH, s[0] + 1);
            L.push("DTSTART;VALUE=DATE:" + ymd(dt), "DTEND;VALUE=DATE:" + ymd(next));
          } else {
            if (tk >= 1440) { dt.setDate(dt.getDate() + 1); tk -= 1440; } // after-midnight set
            L.push("DTSTART;TZID=America/New_York:" + ymd(dt) + "T" + pad(Math.floor(tk / 60)) + pad(tk % 60) + "00", "DURATION:PT3H");
          }
          var desc = [];
          if (s[5]) desc.push(ageLabel(s[5]));
          if (s[4]) desc.push(s[4]);
          if (s[7]) desc.push("Tickets: " + s[7]);
          desc.push("Listings can change — check the venue before you head out.");
          L.push("SUMMARY:" + icsText(s[3] + " at " + s[2]), "LOCATION:" + icsText(s[2]), "DESCRIPTION:" + icsText(desc.join("\n")));
          L.push("END:VEVENT");
        });
        L.push("END:VCALENDAR");
        return L.map(icsFold).join("\r\n") + "\r\n";
      }
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".ics-btn")) return;
        var list = savedShows();
        if (!list.length) return;
        var url = URL.createObjectURL(new Blob([buildIcs(list)], { type: "text/calendar;charset=utf-8" }));
        var a = document.createElement("a");
        a.href = url;
        a.download = "show-me-nyc-" + MONTHS[MONTH].toLowerCase() + "-" + YEAR + ".ics";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      });

      /* ---------- start ---------- */
      /* Where to land: a #day-N link wins (so shared links work); with no
         link, go to today. The hash is never rewritten. */
      function landingDay() {
        var m = /^#day-(\d+)$/.exec(location.hash);
        var d = m ? parseInt(m[1], 10) : 0;
        if (d >= FIRST_DAY && d <= LAST_DAY) return d;
        return inMonth ? todayKey : 0;
      }
      function goToLanding() {
        syncStickyHeight();
        var d = landingDay();
        if (!d) return;
        if (/^#day-/.test(location.hash)) revealDay(d);
        if (!secs[d].el.hidden) jumpTo(secs[d].el);
      }

      build();
      readUrl();
      if (state.saved) showPast = true;
      if (!inMonth && todayKey > 0) {
        $("staleNote").textContent = "These are the " + MONTHS[MONTH] + " " + YEAR + " listings — that month is over, so every show below has already happened.";
        $("staleNote").hidden = false;
      }
      syncControls();
      renderSaved();
      syncStickyHeight();
      apply();
      if ("ResizeObserver" in window) new ResizeObserver(syncStickyHeight).observe(controls);
      window.addEventListener("resize", syncStickyHeight);
      // Let our scroll win over the browser's own scroll-position restore.
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      goToLanding();
      // Re-apply on back/forward (bfcache) and once fonts/layout have settled.
      window.addEventListener("pageshow", function (e) { if (e.persisted) goToLanding(); });
      window.addEventListener("load", function () { setTimeout(goToLanding, 100); });
    </script>
  </body>
</html>
